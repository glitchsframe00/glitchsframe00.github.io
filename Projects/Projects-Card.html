<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>glitchs - Penetration Testing Portfolio</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap');

        :root {
            --bg-main: #050505;
            --bg-card: #0d0d0d;
            --neon-red: #ff1a1a;
            --neon-red-soft: rgba(255, 26, 26, 0.14);
            --dark-red: #4d0000;
            --term-green: #00ff66;
            --text-main: #d4d4d4;
            --text-muted: #888888;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Noto Sans KR', 'Courier New', monospace;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            padding: 40px 20px 80px;
            overflow-x: hidden;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* 터미널 헤더 스타일 */
        .terminal-header {
            background-color: #000;
            border: 1px solid var(--dark-red);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 30px;
            box-shadow: 0 0 15px rgba(255, 26, 26, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            flex-wrap: wrap;
            gap: 16px;
        }

        .term-prompt { color: var(--neon-red); font-weight: bold; font-family: 'Courier New', monospace; }
        .term-cmd { color: #fff; font-family: 'Courier New', monospace; }
        .term-output {
            color: #00ff00;
            margin-top: 10px;
            font-size: 0.9rem;
            line-height: 1.6;
            font-family: 'Courier New', monospace;
        }
        .term-cursor {
            display: inline-block;
            width: 8px;
            height: 15px;
            background-color: var(--neon-red);
            animation: blink 1s step-end infinite;
            vertical-align: middle;
        }

        @keyframes blink { 50% { opacity: 0; } }

        /* 상단 액션 툴바 */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 14px;
            margin-bottom: 24px;
            border-bottom: 2px solid var(--dark-red);
            padding-bottom: 14px;
        }

        .section-title {
            color: #fff;
            font-size: 1.5rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .count-badge {
            font-size: 0.85rem;
            background: var(--neon-red-soft);
            color: var(--neon-red);
            border: 1px solid rgba(255, 26, 26, 0.35);
            padding: 2px 10px;
            border-radius: 999px;
            font-family: 'Courier New', monospace;
        }

        .action-group {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
        }

        .btn {
            background-color: #141414;
            color: var(--text-main);
            border: 1px solid #333;
            padding: 8px 14px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn:hover {
            border-color: var(--neon-red);
            color: #fff;
            background-color: #1c1c1c;
        }

        .btn-primary {
            background-color: rgba(255, 26, 26, 0.15);
            color: #ff4d4d;
            border: 1px solid rgba(255, 26, 26, 0.45);
            font-weight: 700;
        }

        .btn-primary:hover, .btn-active {
            background-color: var(--neon-red);
            color: #fff;
            border-color: var(--neon-red);
        }

        /* 필터 및 검색 영역 */
        .filter-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 24px;
        }

        .category-tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .cat-tab {
            background: #0f0f0f;
            color: var(--text-muted);
            border: 1px solid #262626;
            padding: 6px 13px;
            border-radius: 999px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .cat-tab:hover, .cat-tab.active {
            background: var(--neon-red-soft);
            color: var(--neon-red);
            border-color: rgba(255, 26, 26, 0.45);
            font-weight: 700;
        }

        .search-box {
            flex: 1;
            min-width: 220px;
            max-width: 320px;
        }

        .search-input {
            width: 100%;
            background: #0c0c0c;
            border: 1px solid #2a2a2a;
            border-radius: 6px;
            padding: 8px 12px;
            color: #fff;
            font-size: 0.85rem;
        }

        .search-input:focus {
            outline: none;
            border-color: var(--neon-red);
        }

        /* 카드 그리드 레이아웃 */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
        }

        .card {
            background: linear-gradient(145deg, #0a0a0a 0%, #050505 100%);
            border: 1px solid #222;
            border-left: 3px solid var(--dark-red);
            border-radius: 6px;
            padding: 25px;
            transition: all 0.3s ease;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            cursor: pointer;
        }

        .card:hover {
            border-left: 3px solid var(--neon-red);
            border-color: var(--dark-red);
            transform: translateY(-5px);
            box-shadow: 0 5px 20px rgba(255, 26, 26, 0.15);
        }

        .card-header-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 8px;
            margin-bottom: 10px;
        }

        .date {
            font-family: 'Courier New', Courier, monospace;
            color: var(--text-muted);
            font-size: 0.8rem;
            letter-spacing: 1px;
        }

        .status-pill {
            font-size: 0.68rem;
            padding: 2px 7px;
            border-radius: 4px;
            background: rgba(0, 255, 102, 0.12);
            color: var(--term-green);
            border: 1px solid rgba(0, 255, 102, 0.3);
            white-space: nowrap;
        }

        .project-name {
            color: #fff;
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 12px;
            line-height: 1.4;
        }

        .project-summary {
            color: #9e9e9e;
            font-size: 0.84rem;
            line-height: 1.5;
            margin-bottom: 15px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: auto;
        }

        .tag {
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: bold;
        }

        .tag.role {
            background-color: rgba(255, 26, 26, 0.1);
            color: var(--neon-red);
            border: 1px solid rgba(255, 26, 26, 0.3);
        }

        .tag.client {
            background-color: #1a1a1a;
            color: #aaa;
            border: 1px solid #333;
        }

        /* 관리 모드 컨트롤 버튼 */
        .card-admin-controls {
            display: none;
            gap: 6px;
            margin-top: 14px;
            padding-top: 12px;
            border-top: 1px dashed #262626;
            justify-content: flex-end;
        }

        body.admin-mode .card-admin-controls {
            display: flex;
        }

        .btn-sm {
            padding: 4px 9px;
            font-size: 0.75rem;
            border-radius: 4px;
            background: #161616;
            color: #ccc;
            border: 1px solid #333;
            cursor: pointer;
        }

        .btn-sm:hover {
            border-color: var(--neon-red);
            color: #fff;
        }

        .btn-sm.danger:hover {
            background: rgba(255, 26, 26, 0.2);
            color: #ff6666;
        }

        /* 모달 스타일 */
        .modal-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.82);
            backdrop-filter: blur(4px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }

        .modal-backdrop.open {
            display: flex;
        }

        .modal-box {
            background: #0d0d0d;
            border: 1px solid var(--dark-red);
            border-top: 3px solid var(--neon-red);
            border-radius: 10px;
            width: 100%;
            max-width: 680px;
            max-height: 90vh;
            overflow-y: auto;
            padding: 26px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.8);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 1px solid #222;
        }

        .modal-title {
            font-size: 1.2rem;
            font-weight: 700;
            color: #fff;
        }

        .close-btn {
            background: transparent;
            border: none;
            color: #888;
            font-size: 1.4rem;
            cursor: pointer;
        }

        .close-btn:hover { color: #fff; }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group.full {
            grid-column: 1 / -1;
        }

        .form-label {
            display: block;
            font-size: 0.82rem;
            color: #bbb;
            margin-bottom: 6px;
            font-weight: 500;
        }

        .form-input, .form-textarea {
            width: 100%;
            background: #070707;
            border: 1px solid #2c2c2c;
            border-radius: 6px;
            padding: 10px 12px;
            color: #fff;
            font-size: 0.9rem;
        }

        .form-input:focus, .form-textarea:focus {
            outline: none;
            border-color: var(--neon-red);
        }

        .form-textarea {
            min-height: 130px;
            resize: vertical;
            line-height: 1.6;
        }

        .preset-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 8px;
        }

        .preset-chip {
            font-size: 0.74rem;
            padding: 4px 9px;
            border-radius: 4px;
            background: #171717;
            border: 1px solid #303030;
            color: #bbb;
            cursor: pointer;
        }

        .preset-chip:hover {
            border-color: var(--neon-red);
            color: var(--neon-red);
        }

        .modal-footer {
            display: flex;
            justify-content: flex-end;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 20px;
            padding-top: 14px;
            border-top: 1px solid #222;
        }

        .detail-meta {
            font-family: 'Courier New', monospace;
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-bottom: 8px;
        }

        .detail-body {
            background: #080808;
            border: 1px solid #1f1f1f;
            border-radius: 6px;
            padding: 18px;
            margin-top: 16px;
            color: #d8d8d8;
            font-size: 0.92rem;
            line-height: 1.75;
            white-space: pre-wrap;
        }

        .toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: #141414;
            border: 1px solid var(--neon-red);
            color: #fff;
            padding: 12px 18px;
            border-radius: 8px;
            z-index: 2000;
            opacity: 0;
            transform: translateY(10px);
            pointer-events: none;
            transition: all 0.25s ease;
        }

        .toast.show {
            opacity: 1;
            transform: translateY(0);
        }

        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 50px 20px;
            border: 1px dashed #2a2a2a;
            border-radius: 8px;
            color: var(--text-muted);
        }

        @media (max-width: 640px) {
            .form-grid { grid-template-columns: 1fr; }
            .top-bar { flex-direction: column; align-items: flex-start; }
            .search-box { max-width: 100%; width: 100%; }
        }
    </style>
</head>
<body class="admin-mode">

<div class="container">
    <!-- 터미널 헤더 -->
    <div class="terminal-header">
        <div>
            <div><span class="term-prompt">root@glitchs:~/portfolio$</span> <span class="term-cmd">cat experience_log.txt</span></div>
            <div class="term-output">
                [+] Loading Security Assessment &amp; Penetration Testing Records...<br>
                [+] Total <span id="missionCount">14</span> Missions Accomplished.<br>
                [+] Target: Web, Mobile App, Infrastructure.<br>
                [+] Status: READY <span class="term-cursor"></span>
            </div>
        </div>
        <div class="action-group">
            <button type="button" class="btn btn-primary" id="btnOpenWrite">+ 새 프로젝트 글쓰기</button>
            <button type="button" class="btn btn-active" id="btnToggleAdmin">관리 모드 ON</button>
            <button type="button" class="btn" id="btnOpenGithub">GitHub 동기화 설정</button>
            <button type="button" class="btn" id="btnDownloadHtml">HTML 다운로드</button>
        </div>
    </div>

    <div class="top-bar">
        <div class="section-title">
            <span>PROJECT &amp; EXPERIENCE</span>
            <span class="count-badge" id="filteredCountBadge">14 Posts</span>
        </div>
    </div>

    <!-- 카테고리 탭 & 검색 필터 -->
    <div class="filter-bar">
        <div class="category-tabs" id="categoryTabs">
            <button type="button" class="cat-tab active" data-filter="all">전체보기</button>
            <button type="button" class="cat-tab" data-filter="웹 모의해킹">웹 모의해킹</button>
            <button type="button" class="cat-tab" data-filter="앱 모의해킹">앱 모의해킹</button>
            <button type="button" class="cat-tab" data-filter="인프라 진단">인프라 진단</button>
            <button type="button" class="cat-tab" data-filter="ISMS">ISMS 인증컨설팅</button>
        </div>
        <div class="search-box">
            <input type="text" id="searchInput" class="search-input" placeholder="프로젝트명, 고객사, 태그 검색...">
        </div>
    </div>

    <!-- 프로젝트 카드 그리드 -->
    <div class="grid" id="projectGrid"></div>
</div>

<!-- 1. 티스토리 스타일 프로젝트 작성/수정 모달 -->
<div class="modal-backdrop" id="editorModal">
    <div class="modal-box">
        <div class="modal-header">
            <div class="modal-title" id="editorModalTitle">새 프로젝트 포스트 작성</div>
            <button type="button" class="close-btn" id="btnCloseEditor">&times;</button>
        </div>
        <form id="projectForm">
            <input type="hidden" id="editProjectId">
            <div class="form-grid">
                <div class="form-group">
                    <label class="form-label" for="inputStartDate">시작일 (또는 전체 기간)</label>
                    <input type="text" id="inputStartDate" class="form-input" placeholder="예: 2026. 10. 15" required>
                </div>
                <div class="form-group">
                    <label class="form-label" for="inputEndDate">종료일 (선택)</label>
                    <input type="text" id="inputEndDate" class="form-input" placeholder="예: 2026. 11. 30">
                </div>
            </div>
            <div class="form-group">
                <label style="display:inline-flex;align-items:center;gap:8px;font-size:0.84rem;color:#ccc;cursor:pointer;">
                    <input type="checkbox" id="inputOngoing"> 현재 진행중인 프로젝트로 표시
                </label>
            </div>
            <div class="form-group">
                <label class="form-label" for="inputProjectName">프로젝트 제목 *</label>
                <input type="text" id="inputProjectName" class="form-input" placeholder="예: OO금융 웹&앱 취약점 진단" required>
            </div>
            <div class="form-grid">
                <div class="form-group">
                    <label class="form-label" for="inputRoleTag">수행 역할 태그 (Role) *</label>
                    <input type="text" id="inputRoleTag" class="form-input" placeholder="예: 웹 모의해킹" required>
                    <div class="preset-chips" id="rolePresetChips">
                        <button type="button" class="preset-chip" data-role="웹 모의해킹">+ 웹 모의해킹</button>
                        <button type="button" class="preset-chip" data-role="웹&앱 모의해킹">+ 웹&amp;앱 모의해킹</button>
                        <button type="button" class="preset-chip" data-role="인프라 진단">+ 인프라 진단</button>
                        <button type="button" class="preset-chip" data-role="웹&앱 모의해킹 / 인프라 진단">+ 웹&amp;앱 / 인프라</button>
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label" for="inputClientTag">고객사 / 기관명 태그 (선택)</label>
                    <input type="text" id="inputClientTag" class="form-input" placeholder="예: 데상트 코리아">
                </div>
            </div>
            <div class="form-group full">
                <label class="form-label" for="inputProjectSummary">상세 노트 / 수행 내용 (카드 클릭 시 열람 가능, 선택)</label>
                <textarea id="inputProjectSummary" class="form-textarea" placeholder="주요 진단 대상, 발견 취약점 유형, 수행 성과 등 기록할 내용을 작성하세요."></textarea>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn" id="btnCancelEditor">취소</button>
                <button type="submit" class="btn btn-primary">브라우저 저장</button>
                <button type="button" class="btn btn-primary" id="btnSaveAndCommit">저장 + GitHub 바로 반영</button>
            </div>
        </form>
    </div>
</div>

<!-- 2. 상세 보기 모달 -->
<div class="modal-backdrop" id="detailModal">
    <div class="modal-box">
        <div class="modal-header">
            <div>
                <div class="detail-meta" id="detailDate"></div>
                <div class="modal-title" id="detailTitle"></div>
            </div>
            <button type="button" class="close-btn" id="btnCloseDetail">&times;</button>
        </div>
        <div class="tags" id="detailTags" style="margin-bottom: 12px;"></div>
        <div class="detail-body" id="detailContent"></div>
        <div class="modal-footer">
            <button type="button" class="btn" id="btnEditFromDetail">이 프로젝트 수정</button>
            <button type="button" class="btn btn-primary" id="btnCloseDetailFooter">닫기</button>
        </div>
    </div>
</div>

<!-- 3. GitHub 저장소 연동 설정 모달 -->
<div class="modal-backdrop" id="githubModal">
    <div class="modal-box">
        <div class="modal-header">
            <div class="modal-title">GitHub 저장소 직접 커밋 설정</div>
            <button type="button" class="close-btn" id="btnCloseGithub">&times;</button>
        </div>
        <div class="form-grid">
            <div class="form-group">
                <label class="form-label" for="ghOwner">GitHub Owner</label>
                <input type="text" id="ghOwner" class="form-input" value="glitchsframe00">
            </div>
            <div class="form-group">
                <label class="form-label" for="ghRepo">Repository</label>
                <input type="text" id="ghRepo" class="form-input" value="glitchsframe00.github.io">
            </div>
            <div class="form-group">
                <label class="form-label" for="ghBranch">Branch</label>
                <input type="text" id="ghBranch" class="form-input" value="main">
            </div>
            <div class="form-group">
                <label class="form-label" for="ghPath">Target File Path</label>
                <input type="text" id="ghPath" class="form-input" value="Projects/Projects-Card.html">
            </div>
            <div class="form-group full">
                <label class="form-label" for="ghToken">GitHub Personal Access Token (기존 editor.html 토큰과 자동 공유)</label>
                <input type="password" id="ghToken" class="form-input" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx">
            </div>
        </div>
        <div class="modal-footer">
            <button type="button" class="btn" id="btnSaveGithubConfig">설정 저장</button>
            <button type="button" class="btn btn-primary" id="btnPushToGithub">지금 GitHub에 커밋하기</button>
        </div>
    </div>
</div>

<div class="toast" id="toastBox"></div>

    {"id":"proj-3","date":"2025. 08. 04 - 2025. 10. 31","name":"BNP파리바 카디프생명 ISMS 인증컨설팅","role":"웹 모의해킹 / 인프라 진단","client":"BNP파리바 카디프생명","ongoing":false,"summary":""},
    {"id":"proj-4","date":"2025. 11. 03 - 2025. 12. 29","name":"하고 하우스 웹 취약점 진단","role":"웹 모의해킹","client":"하고하우스","ongoing":false,"summary":""},
    {"id":"proj-5","date":"2025. 11. 03 - 2025. 12. 29","name":"패션 플러스 웹 취약점 진단","role":"웹 모의해킹","client":"패션플러스","ongoing":false,"summary":""},
    {"id":"proj-6","date":"2026. 01. 26 - 2026. 02. 13","name":"한국보훈복지의료공단 인프라 진단","role":"인프라 진단","client":"케이엘정보통신","ongoing":false,"summary":""},
    {"id":"proj-7","date":"2026. 03. 03 - 2026. 06. 01","name":"롯데렌탈 웹&앱 취약점 진단","role":"웹 모의해킹","client":"롯데렌탈 본사","ongoing":false,"summary":""},
    {"id":"proj-8","date":"2026. 06. 11 - 2026. 06. 18","name":"씨앤비솔루션","role":"인프라 진단","client":"","ongoing":false,"summary":""},
    {"id":"proj-9","date":"2026. 06. 29 - 2026. 07. 03","name":"하고하우스(PB브랜드-CAFE24)","role":"웹 모의해킹","client":"","ongoing":false,"summary":""},
    {"id":"proj-10","date":"2026. 07. 06 - 2026. 07. 31","name":"DNInc","role":"웹 모의해킹","client":"","ongoing":false,"summary":""},
    {"id":"proj-11","date":"2026. 08. 03 - 2026. 08. 14","name":"리워드허브","role":"웹 모의해킹","client":"","ongoing":false,"summary":""},
    {"id":"proj-12","date":"2026. 08. 17 - 2026. 08. 28","name":"문화재단","role":"웹 모의해킹","client":"","ongoing":false,"summary":""},
    {"id":"proj-13","date":"2026. 09. 07 - 2026. 00. 00 -{진행중(수정 예정)}","name":"BNP파리바 카디프생명","role":"웹 모의해킹","client":"","ongoing":true,"summary":""},
    {"id":"proj-14","date":"2026. 09. 10 - 2026. 09. 23","name":"쿠팡로지틱스","role":"웹 모의해킹","client":"","ongoing":false,"summary":""}
]
</script>

<script>
(function() {
    const STORAGE_KEY = 'glitchs_projects_data_v1';
    let projects = [];
    let currentFilter = 'all';
    let searchQuery = '';
    let currentDetailId = null;

    function safeGet(k, fb) {
        try { const v = localStorage.getItem(k); return v !== null ? v : fb; } catch (e) { return fb; }
    }
    function safeSet(k, v) {
        try { localStorage.setItem(k, v); } catch (e) {}
    }
    function showToast(msg) {
        const t = document.getElementById('toastBox');
        t.textContent = msg;
        t.classList.add('show');
        clearTimeout(showToast._t);
        showToast._t = setTimeout(function() { t.classList.remove('show'); }, 2800);
    }
    function esc(s) {
        return String(s || '')
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;');
    }

    function loadData() {
        const def = document.getElementById('initialProjectsData').textContent.trim();
        const saved = safeGet(STORAGE_KEY, null);
        if (saved) {
            try {
                const p = JSON.parse(saved);
                if (Array.isArray(p) && p.length) { projects = p; return; }
            } catch (e) {}
        }
        projects = JSON.parse(def);
    }

    function saveLocal() {
        safeSet(STORAGE_KEY, JSON.stringify(projects));
    }

    function render() {
        const grid = document.getElementById('projectGrid');
        document.getElementById('missionCount').textContent = String(projects.length);

        const filtered = projects.filter(function(p) {
            const mc = currentFilter === 'all' ||
                (p.role && p.role.indexOf(currentFilter) !== -1) ||
                (p.name && p.name.indexOf(currentFilter) !== -1);
            const q = searchQuery.toLowerCase();
            const ms = !q ||
                (p.name && p.name.toLowerCase().indexOf(q) !== -1) ||
                (p.role && p.role.toLowerCase().indexOf(q) !== -1) ||
                (p.client && p.client.toLowerCase().indexOf(q) !== -1) ||
                (p.date && p.date.toLowerCase().indexOf(q) !== -1);
            return mc && ms;
        });

        document.getElementById('filteredCountBadge').textContent = filtered.length + ' Posts';

        if (!filtered.length) {
            grid.innerHTML = '<div class="empty-state">조건에 맞는 프로젝트가 없습니다.</div>';
            return;
        }

        grid.innerHTML = filtered.map(function(p) {
            return (
                '<div class="card" data-card-id="' + esc(p.id) + '">' +
                    '<div>' +
                        '<div class="card-header-row">' +
                            '<div class="date">' + esc(p.date) + '</div>' +
                            (p.ongoing ? '<span class="status-pill">진행중</span>' : '') +
                        '</div>' +
                        '<div class="project-name">' + esc(p.name) + '</div>' +
                        (p.summary ? '<div class="project-summary">' + esc(p.summary) + '</div>' : '') +
                    '</div>' +
                    '<div>' +
                        '<div class="tags">' +
                            '<span class="tag role">' + esc(p.role) + '</span>' +
                            (p.client ? '<span class="tag client">' + esc(p.client) + '</span>' : '') +
                        '</div>' +
                        '<div class="card-admin-controls">' +
                            '<button type="button" class="btn-sm" data-action="up" data-id="' + esc(p.id) + '">▲</button>' +
                            '<button type="button" class="btn-sm" data-action="down" data-id="' + esc(p.id) + '">▼</button>' +
                            '<button type="button" class="btn-sm" data-action="edit" data-id="' + esc(p.id) + '">수정</button>' +
                            '<button type="button" class="btn-sm danger" data-action="delete" data-id="' + esc(p.id) + '">삭제</button>' +
                        '</div>' +
                    '</div>' +
                '</div>'
            );
        }).join('');
    }

    function openEditor(proj) {
        document.getElementById('editorModalTitle').textContent = proj ? '프로젝트 포스트 수정' : '새 프로젝트 포스트 작성';
        document.getElementById('editProjectId').value = proj ? proj.id : '';
        if (proj) {
            const pts = (proj.date || '').split(' - ');
            document.getElementById('inputStartDate').value = pts[0] ? pts[0].trim() : proj.date;
            document.getElementById('inputEndDate').value = pts[1] ? pts[1].replace('-{진행중(수정 예정)}', '').trim() : '';
            document.getElementById('inputOngoing').checked = !!proj.ongoing;
            document.getElementById('inputProjectName').value = proj.name || '';
            document.getElementById('inputRoleTag').value = proj.role || '';
            document.getElementById('inputClientTag').value = proj.client || '';
            document.getElementById('inputProjectSummary').value = proj.summary || '';
        } else {
            const now = new Date();
            const yyyy = now.getFullYear();
            const mm = String(now.getMonth() + 1).padStart(2, '0');
            const dd = String(now.getDate()).padStart(2, '0');
            document.getElementById('inputStartDate').value = yyyy + '. ' + mm + '. ' + dd;
            document.getElementById('inputEndDate').value = '';
            document.getElementById('inputOngoing').checked = false;
            document.getElementById('inputProjectName').value = '';
            document.getElementById('inputRoleTag').value = '웹 모의해킹';
            document.getElementById('inputClientTag').value = '';
            document.getElementById('inputProjectSummary').value = '';
        }
        document.getElementById('editorModal').classList.add('open');
    }

    function saveFromModal() {
        const id = document.getElementById('editProjectId').value || ('proj-' + Date.now());
        const s = document.getElementById('inputStartDate').value.trim();
        const e = document.getElementById('inputEndDate').value.trim();
        const og = document.getElementById('inputOngoing').checked;
        const name = document.getElementById('inputProjectName').value.trim();
        const role = document.getElementById('inputRoleTag').value.trim();
        const client = document.getElementById('inputClientTag').value.trim();
        const summary = document.getElementById('inputProjectSummary').value.trim();

        if (!s || !name || !role) {
            showToast('시작일, 제목, 역할 태그는 필수입니다.');
            return false;
        }

        const fullDate = e
            ? (s + ' - ' + e)
            : (og && s.indexOf('-') === -1 ? (s + ' - 2026. 00. 00 -{진행중(수정 예정)}') : s);

        const item = { id: id, date: fullDate, name: name, role: role, client: client, ongoing: og, summary: summary };
        const idx = projects.findIndex(function(p) { return p.id === id; });
        if (idx >= 0) projects[idx] = item; else projects.push(item);

        saveLocal();
        render();
        document.getElementById('editorModal').classList.remove('open');
        showToast('프로젝트가 저장되었습니다.');
        return true;
    }

    function buildExportHtml() {
        const clone = document.documentElement.cloneNode(true);
        const ds = clone.querySelector('#initialProjectsData');
        if (ds) ds.textContent = '\n' + JSON.stringify(projects, null, 4) + '\n';
        const toastEl = clone.querySelector('#toastBox');
        if (toastEl) toastEl.classList.remove('show');
        clone.querySelectorAll('.modal-backdrop').forEach(function(m) { m.classList.remove('open'); });
        return '<!DOCTYPE html>\n' + clone.outerHTML;
    }

    async function pushToGithub() {
        const owner = document.getElementById('ghOwner').value.trim();
        const repo = document.getElementById('ghRepo').value.trim();
        const branch = document.getElementById('ghBranch').value.trim() || 'main';
        const path = document.getElementById('ghPath').value.trim() || 'Projects/Projects-Card.html';
        const token = document.getElementById('ghToken').value.trim() || safeGet('gh_token', '');

        if (!token) {
            document.getElementById('githubModal').classList.add('open');
            showToast('GitHub 토큰(gh_token)을 입력해 주세요.');
            return;
        }

        safeSet('gh_token', token);
        showToast('GitHub 저장소에 커밋하는 중...');
        const apiUrl = 'https://api.github.com/repos/' + owner + '/' + repo + '/contents/' + path;

        try {
            let sha;
            const gr = await fetch(apiUrl + '?ref=' + branch, {
                headers: { 'Authorization': 'Bearer ' + token, 'Accept': 'application/vnd.github+json' }
            });
            if (gr.ok) {
                const meta = await gr.json();
                sha = meta.sha;
            }
            const bytes = new TextEncoder().encode(buildExportHtml());
            let bin = '';
            for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
            const body = {
                message: 'feat: update Projects-Card.html (' + projects.length + ' projects)',
                content: btoa(bin),
                branch: branch
            };
            if (sha) body.sha = sha;

            const pr = await fetch(apiUrl, {
                method: 'PUT',
                headers: {
                    'Authorization': 'Bearer ' + token,
                    'Accept': 'application/vnd.github+json',
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(body)
            });
            if (!pr.ok) throw new Error('HTTP ' + pr.status);
            document.getElementById('githubModal').classList.remove('open');
            showToast('GitHub 커밋 완료!');
        } catch (err) {
            showToast('커밋 실패: ' + err.message);
        }
    }

    document.getElementById('btnOpenWrite').addEventListener('click', function() { openEditor(null); });
    document.getElementById('btnCloseEditor').addEventListener('click', function() { document.getElementById('editorModal').classList.remove('open'); });
    document.getElementById('btnCancelEditor').addEventListener('click', function() { document.getElementById('editorModal').classList.remove('open'); });
    document.getElementById('projectForm').addEventListener('submit', function(e) { e.preventDefault(); saveFromModal(); });
    document.getElementById('btnSaveAndCommit').addEventListener('click', function() { if (saveFromModal()) pushToGithub(); });

    document.getElementById('rolePresetChips').addEventListener('click', function(e) {
        const b = e.target.closest('[data-role]');
        if (b) document.getElementById('inputRoleTag').value = b.getAttribute('data-role');
    });

    document.getElementById('btnToggleAdmin').addEventListener('click', function() {
        const on = document.body.classList.toggle('admin-mode');
        this.textContent = on ? '관리 모드 ON' : '관리 모드 OFF';
        this.classList.toggle('btn-active', on);
    });

    document.getElementById('btnOpenGithub').addEventListener('click', function() {
        document.getElementById('ghToken').value = safeGet('gh_token', '');
        document.getElementById('githubModal').classList.add('open');
    });
    document.getElementById('btnCloseGithub').addEventListener('click', function() { document.getElementById('githubModal').classList.remove('open'); });
    document.getElementById('btnSaveGithubConfig').addEventListener('click', function() {
        safeSet('gh_token', document.getElementById('ghToken').value.trim());
        showToast('토큰 설정이 저장되었습니다.');
    });
    document.getElementById('btnPushToGithub').addEventListener('click', pushToGithub);

    document.getElementById('btnDownloadHtml').addEventListener('click', function() {
        const blob = new Blob([buildExportHtml()], { type: 'text/html;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'Projects-Card.html';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    });

    document.getElementById('categoryTabs').addEventListener('click', function(e) {
        const t = e.target.closest('.cat-tab');
        if (!t) return;
        document.querySelectorAll('.cat-tab').forEach(function(el) { el.classList.remove('active'); });
        t.classList.add('active');
        currentFilter = t.getAttribute('data-filter');
        render();
    });

    document.getElementById('searchInput').addEventListener('input', function(e) {
        searchQuery = e.target.value.trim();
        render();
    });

    document.getElementById('projectGrid').addEventListener('click', function(e) {
        const act = e.target.closest('[data-action]');
        if (act) {
            e.stopPropagation();
            const action = act.getAttribute('data-action');
            const id = act.getAttribute('data-id');
            const idx = projects.findIndex(function(p) { return p.id === id; });
            if (idx === -1) return;

            if (action === 'edit') {
                openEditor(projects[idx]);
            } else if (action === 'delete') {
                projects.splice(idx, 1);
                saveLocal();
                render();
                showToast('삭제되었습니다.');
            } else if (action === 'up' && idx > 0) {
                const tmp = projects[idx - 1];
                projects[idx - 1] = projects[idx];
                projects[idx] = tmp;
                saveLocal();
                render();
            } else if (action === 'down' && idx < projects.length - 1) {
                const tmp = projects[idx + 1];
                projects[idx + 1] = projects[idx];
                projects[idx] = tmp;
                saveLocal();
                render();
            }
            return;
        }

        const card = e.target.closest('[data-card-id]');
        if (card) {
            const proj = projects.find(function(p) { return p.id === card.getAttribute('data-card-id'); });
            if (!proj) return;
            currentDetailId = proj.id;
            document.getElementById('detailDate').textContent = proj.date;
            document.getElementById('detailTitle').textContent = proj.name;
            document.getElementById('detailTags').innerHTML =
                '<span class="tag role">' + esc(proj.role) + '</span>' +
                (proj.client ? ' <span class="tag client">' + esc(proj.client) + '</span>' : '');
            document.getElementById('detailContent').textContent =
                proj.summary || '등록된 상세 수행 노트가 없습니다. [이 프로젝트 수정] 버튼을 눌러 티스토리 본문처럼 상세 내용을 작성해 보세요.';
            document.getElementById('detailModal').classList.add('open');
        }
    });

    document.getElementById('btnCloseDetail').addEventListener('click', function() { document.getElementById('detailModal').classList.remove('open'); });
    document.getElementById('btnCloseDetailFooter').addEventListener('click', function() { document.getElementById('detailModal').classList.remove('open'); });
    document.getElementById('btnEditFromDetail').addEventListener('click', function() {
        document.getElementById('detailModal').classList.remove('open');
        const proj = projects.find(function(p) { return p.id === currentDetailId; });
        if (proj) openEditor(proj);
    });

    loadData();
    render();
})();
</script>
</body>
